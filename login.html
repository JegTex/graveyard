<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Graveyard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#0B0B0B;--card:#121212;--line:#262626;--fg:#F3F2EE;--muted:#8D8C88;--bad:#F2877C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:14px/1.5 "Geist",ui-sans-serif,system-ui,sans-serif;padding:16px}
form{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:14px;animation:in .3s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:scale(.97)}}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.brand svg{width:18px;height:22px;fill:#FCF9F1}
.brand small{font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;align-self:flex-end}
p{margin:0;color:var(--muted)}
input{height:42px;border-radius:10px;border:1px solid var(--line);background:#1B1B1B;color:var(--fg);padding:0 12px;font:inherit;outline:none}
input:focus{border-color:#4A4945}
button{height:42px;border-radius:10px;border:0;background:#fff;color:#111;font:600 14px/1 "Geist",ui-sans-serif,system-ui,sans-serif;cursor:pointer}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
@media (prefers-reduced-motion:reduce){form{animation:none}}
</style>
</head>
<body>
<form id="f">
  <div class="brand"><svg viewBox="0 3 40 42" aria-hidden="true"><path d="M19.2871 13.4773H29.167L39.4287 23.6101L21.583 44.0271H11.2129L20.1426 33.8728H10.2627L0 23.74L17.8457 3.323H28.2158L19.2871 13.4773ZM10.2627 23.74L20.2803 33.7146L29.167 23.6101L19.1484 13.6335L10.2627 23.74Z"/></svg>Graveyard<small>by Prismatico</small></div>
  <p>Enter the team passcode.</p>
  <input id="p" type="password" autocomplete="current-password" aria-label="Passcode" autofocus required>
  <button type="submit">Enter</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({passcode:document.getElementById('p').value})});
  if(r.ok)location.href='/';else document.getElementById('e').textContent='Wrong passcode. Try again.';
});
</script>
</body>
</html>
